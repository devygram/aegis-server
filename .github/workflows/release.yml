name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write   # needed to create the release and attach the DMG
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project "Aegis Server/Aegis Server.xcodeproj" \
            -scheme "Aegis Server" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Make DMG
        run: |
          brew install create-dmg
          mkdir -p stage dist
          cp -R "build/Build/Products/Release/Aegis Server.app" stage/
          create-dmg \
            --volname "Aegis Server" \
            --icon "Aegis Server.app" 160 200 \
            --app-drop-link 400 200 \
            --window-size 560 400 \
            --hide-extension "Aegis Server.app" \
            "dist/Aegis-Server.dmg" \
            "stage/" || true
          # fallback: plain DMG if the fancy layout step failed on the headless runner
          [ -f "dist/Aegis-Server.dmg" ] || \
            hdiutil create -volname "Aegis Server" -srcfolder stage -ov -format UDZO "dist/Aegis-Server.dmg"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Aegis-Server.dmg
          generate_release_notes: true
